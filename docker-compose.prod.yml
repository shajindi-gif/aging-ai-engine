# 自有服务器生产部署（与 fengyuxueye 同机，加入其网络供边缘 nginx 直连）
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://yanglaoai999.com
    image: yanglaoai-app
    container_name: yanglaoai-app
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "3000"
    networks:
      - fengyuxueye_app-network

networks:
  fengyuxueye_app-network:
    external: true
